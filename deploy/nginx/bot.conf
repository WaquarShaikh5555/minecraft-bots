# ─────────────────────────────────────────────────────────────────────────────
#  nginx reverse proxy for the dashboard, with WebSocket upgrade + free TLS
#  from Let's Encrypt. Use this instead of a Cloudflare tunnel if you prefer
#  to terminate TLS on the VM itself.
#
#    sudo apt install -y nginx certbot python3-certbot-nginx
#    sudo cp deploy/nginx/bot.conf /etc/nginx/sites-available/bot.conf
#    sudo ln -s /etc/nginx/sites-available/bot.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d bot.arterex.me      # adds the TLS lines for you
#
#  DNS: create an A record bot.arterex.me -> your VM public IP.
#  Azure: allow inbound TCP 80 and 443 in the VM's NSG.
# ─────────────────────────────────────────────────────────────────────────────

# WebSocket upgrade helper
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bot.arterex.me;

    # certbot replaces this with a redirect to 443 once TLS exists
    location /.well-known/acme-challenge/ { root /var/www/html; }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Chat is a long-lived connection: no buffering, long timeouts.
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        chunked_transfer_encoding on;
    }

    # Basic abuse protection for the public read endpoints
    client_max_body_size 32k;
}

# After `certbot --nginx`, the generated block looks roughly like this:
#
# server {
#     listen 443 ssl http2;
#     server_name bot.arterex.me;
#     ssl_certificate     /etc/letsencrypt/live/bot.arterex.me/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/bot.arterex.me/privkey.pem;
#     location / { ...same proxy settings as above... }
# }
