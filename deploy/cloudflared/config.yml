# ─────────────────────────────────────────────────────────────────────────────
#  Cloudflare Tunnel — free HTTPS + WSS for the dashboard, no open ports.
#
#  Use this when you own a domain on Cloudflare (e.g. arterex.me) and want a
#  permanent address like https://bot.arterex.me without touching the Azure NSG
#  and without running certbot.
#
#  One-time setup on the VM (you need a Cloudflare account, free tier is fine):
#
#    cloudflared tunnel login                      # opens a browser link
#    cloudflared tunnel create minecraft-bot       # prints a TUNNEL UUID
#    cloudflared tunnel route dns minecraft-bot bot.arterex.me
#    sudo cp deploy/cloudflared/config.yml /etc/cloudflared/config.yml
#    # edit the two <...> placeholders below
#    sudo cloudflared service install              # installs + starts the service
#    systemctl status cloudflared
#
#  Then in /opt/minecraft-bots/.env:
#    ALLOWED_ORIGINS=https://bot.arterex.me        # only if the site is hosted elsewhere
# ─────────────────────────────────────────────────────────────────────────────

tunnel: <TUNNEL-UUID>
credentials-file: /root/.cloudflared/<TUNNEL-UUID>.json

ingress:
  - hostname: bot.arterex.me
    service: http://127.0.0.1:8080
    originRequest:
      connectTimeout: 30s
      # WebSockets are proxied automatically; no extra config needed.
      http2Origin: false

  # Anything that does not match a hostname above gets a 404. Required.
  - service: http_status:404
